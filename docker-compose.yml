
services:
  postgres:
    image: ankane/pgvector:latest
    container_name: campus_hire_postgres
    environment:
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  campus_hire_redis:
    image: redis:8.6.4-alpine
    container_name: campus_hire_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data: